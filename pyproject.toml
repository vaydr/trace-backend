[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trace-kgqa-backend"
version = "0.1.0"
description = "TRACE: WebQSP retrieval, anchor expansion, and evidence path search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/SubgraphRAG.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3", "numpy>=1.26,<3", "pyyaml>=6,<7",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.48,<5", "sentence-transformers>=3,<6", "datasets>=3,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
trace = "trace_backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
